name: CoachLab
options:
  bundleIdPrefix: cc.xiaorsz.dictation-coach-lab
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    PRODUCT_NAME: "$(TARGET_NAME)"
    CLANG_ENABLE_MODULES: YES
    ALWAYS_SEARCH_USER_PATHS: NO
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_OPTIMIZATION_LEVEL: "-O"
    LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @loader_path/Frameworks"
    DEVELOPMENT_TEAM: FCAW792CJD
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "0.3.7"
    CURRENT_PROJECT_VERSION: "11"
  configs:
    Debug:
      APS_ENVIRONMENT: development
      CLOUDKIT_ENVIRONMENT: Development
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      ENABLE_TESTABILITY: YES
    Release:
      APS_ENVIRONMENT: production
      CLOUDKIT_ENVIRONMENT: Production
      ENABLE_TESTABILITY: NO
targets:
  CoachCore:
    type: framework
    platform: iOS
    sources: [Core]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.xiaorsz.dictation-coach-lab.core
        SKIP_INSTALL: YES
        DEFINES_MODULE: YES
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        INSTALL_PATH: "$(LOCAL_LIBRARY_DIR)/Frameworks"
        TARGETED_DEVICE_FAMILY: "1,2"
  CoachLab:
    type: application
    platform: iOS
    entitlements:
      path: FullApp/CoachLab.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
        com.apple.developer.icloud-container-identifiers:
          - iCloud.cc.xiaorsz.dictation-coach-lab
        com.apple.developer.icloud-services:
          - CloudKit
          - CloudDocuments
        com.apple.developer.icloud-container-environment: $(CLOUDKIT_ENVIRONMENT)
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.cc.xiaorsz.dictation-coach-lab
    sources:
      - path: FullApp
        excludes: [Info.plist, "Preview Content"]
    dependencies:
      - sdk: libsqlite3.tbd
      - target: CoachCore
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.xiaorsz.dictation-coach-lab
        PRODUCT_NAME: CoachLab
        SWIFT_OBJC_BRIDGING_HEADER: FullApp/TypoReview-Bridging-Header.h
        INFOPLIST_FILE: FullApp/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: "听写复习本AI版"
        INFOPLIST_KEY_CFBundleDevelopmentRegion: zh_CN
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        SUPPORTS_MACCATALYST: NO
  CoachCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: CoachCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.xiaorsz.dictation-coach-lab.tests
  CoachLabUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: CoachLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.xiaorsz.dictation-coach-lab.uitests
        TEST_TARGET_NAME: CoachLab
  FullAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [FullAppTests]
    dependencies:
      - target: CoachLab
      - target: CoachCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.xiaorsz.dictation-coach-lab.fulltests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CoachLab.app/CoachLab"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  CoachLab:
    build:
      targets:
        CoachLab: all
    test:
      targets: [CoachCoreTests, FullAppTests, CoachLabUITests]
    run:
      config: Debug
